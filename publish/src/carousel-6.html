<!DOCTYPE html>
<!-- Figma Community carousel 6 (1920×1080): variables. Render with `npm run listing`. -->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="listing.css">
  <style>
    .fp {
      width: 680px;
    }

    .fp-field {
      padding-left: 10px;
    }
  </style>
</head>

<body>
  <div class="stage split">
    <div>
      <p class="kicker">Variables</p>
      <h2>Tokens stay <span class="quiet">tokens.</span></h2>
      <p class="lead">Spacing, radius, size, opacity, fills and strokes are bound to the same variables as the source, not pasted as raw values.</p>
    </div>

    <div class="visual">
      <div class="fp copy">
        <div class="fp-head"><span class="diamond"></span>Card</div>
        <div class="fp-sec">
          <div class="fp-title">Layout</div>
          <div class="fp-row changed"><span class="fp-label">Gap</span><span class="fp-field"><span class="var">space/400</span></span></div>
          <div class="fp-row changed"><span class="fp-label">Padding</span><span class="fp-field"><span class="var">space/600</span></span></div>
          <div class="fp-row changed"><span class="fp-label">Radius</span><span class="fp-field"><span class="var">radius/md</span></span></div>
          <div class="fp-row changed"><span class="fp-label">Opacity</span><span class="fp-field"><span class="var">opacity/100</span></span></div>
        </div>
        <div class="fp-sec">
          <div class="fp-title">Fill and stroke</div>
          <div class="fp-row changed"><span class="fp-label">Fill</span><span class="fp-field"><span class="var color"><span class="swatch" style="background:#ffffff"></span>surface/default</span></span></div>
          <div class="fp-row changed"><span class="fp-label">Stroke</span><span class="fp-field"><span class="var color"><span class="swatch" style="background:#ecebf0"></span>border/subtle</span></span></div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
