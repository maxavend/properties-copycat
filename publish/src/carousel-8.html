<!DOCTYPE html>
<!-- Figma Community carousel 8 (1920×1080): closing slide. Render with `npm run listing`. -->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="listing.css">
  <style>
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* The plugin icon as it appears in Figma: a rounded tile */
    .app-icon {
      width: 208px;
      height: 208px;
      margin-bottom: 72px;
      border-radius: 48px;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.08), 0 24px 60px rgba(0, 0, 0, 0.45);
    }

    h2 {
      font-size: 112px;
    }

    .lead {
      margin-top: 36px;
    }

    .lead b {
      font-weight: 600;
      color: var(--text);
    }
  </style>
</head>

<body>
  <div class="stage">
    <img class="app-icon" src="../icon.svg" alt="">
    <h2>One setup. Every instance.</h2>
    <p class="lead">Find <b>Properties Copycat</b> in Figma under Plugins.</p>
  </div>
</body>

</html>
