<!DOCTYPE html>
<!-- Figma Community carousel 4 (1920×1080): text. Render with `npm run listing`. -->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="listing.css">
  <style>
    .sample {
      display: flex;
      flex-direction: column;
      gap: 76px;
    }

    .textbox {
      width: 420px;
      padding: 26px 28px;
    }

    .textbox .t {
      font-size: 40px;
      font-weight: 650;
      letter-spacing: -0.02em;
      color: var(--card-text);
    }

    .textbox .s {
      margin-top: 8px;
      font-size: 22px;
      color: var(--card-muted);
    }

    .seg {
      display: flex;
      gap: 6px;
      padding: 6px;
      border-radius: 10px;
      background: #383838;
      width: max-content;
    }

    .seg span {
      display: grid;
      place-items: center;
      width: 52px;
      height: 44px;
      border-radius: 8px;
    }

    .seg span.on {
      background: #4a4a4a;
    }

    .seg svg {
      width: 26px;
      height: 26px;
    }
  </style>
</head>

<body>
  <div class="stage split">
    <div>
      <p class="kicker">Text</p>
      <h2>Text that keeps <span class="quiet">its style.</span></h2>
      <p class="lead">Content, text style, color, font, alignment and auto&#8209;resize. When the source uses a text style, the copy gets the style, not a detached look‑alike.</p>
    </div>

    <div class="visual">
      <div class="sample" id="sample"></div>
      <div class="fp copy">
        <div class="fp-head"><span class="diamond"></span>Title</div>
        <div class="fp-sec">
          <div class="fp-title">Typography</div>
          <div class="fp-row"><span class="fp-label">Style</span><span class="fp-field">Heading / M<span class="chev"></span></span></div>
          <div class="fp-row"><span class="fp-label">Alignment</span>
            <span class="seg"><span class="on"><svg viewBox="0 0 24 24" fill="#e0e0e0"><rect x="3" y="5" width="18" height="2.4" rx="1.2"/><rect x="3" y="10.8" width="12" height="2.4" rx="1.2"/><rect x="3" y="16.6" width="15" height="2.4" rx="1.2"/></svg></span><span><svg viewBox="0 0 24 24" fill="#e0e0e0"><rect x="3" y="5" width="18" height="2.4" rx="1.2"/><rect x="6" y="10.8" width="12" height="2.4" rx="1.2"/><rect x="4.5" y="16.6" width="15" height="2.4" rx="1.2"/></svg></span><span><svg viewBox="0 0 24 24" fill="#e0e0e0"><rect x="3" y="5" width="18" height="2.4" rx="1.2"/><rect x="9" y="10.8" width="12" height="2.4" rx="1.2"/><rect x="6" y="16.6" width="15" height="2.4" rx="1.2"/></svg></span></span>
          </div>
          <div class="fp-row"><span class="fp-label">Resizing</span><span class="fp-field">Auto height<span class="chev"></span></span></div>
        </div>
        <div class="fp-sec">
          <div class="fp-title">Fill</div>
          <div class="fp-row"><span class="fp-label">Color</span><span class="fp-field"><span class="swatch" style="background:#18171c"></span>Text / Primary</span></div>
        </div>
      </div>
    </div>
  </div>

  <template id="box">
    <div class="inst textbox">
      <div class="tag"><span class="diamond"></span><span class="tag-text"></span></div>
      <div class="t">Weekly report</div>
      <div class="s">Heading / M · Text / Primary</div>
    </div>
  </template>

  <script>
    const box = document.getElementById('box').content.firstElementChild;
    for (const [cls, tag] of [[null, 'Source'], ['copy', 'Copy']]) {
      const el = box.cloneNode(true);
      if (cls) el.classList.add(cls);
      el.querySelector('.tag-text').textContent = tag;
      document.getElementById('sample').appendChild(el);
    }
  </script>
</body>

</html>
