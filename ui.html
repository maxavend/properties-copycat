<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Properties Copycat</title>
  <style>
    :root {
      --font-stack: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --color-bg: #FFFFFF;
      --color-text: #333333;
      --color-border: #E5E5E5;
      --color-primary: #18A0FB;
      --color-primary-hover: #0D8DE3;
      --color-secondary: #F5F5F5;
      --color-text-secondary: #888888;
      --color-bg-secondary: #F9F9F9;
      --radius: 4px;

      --padding: 8px;
      --gap: 8px;

      --scrollbar-thumb: rgba(0, 0, 0, 0.15);
      --scrollbar-thumb-hover: rgba(0, 0, 0, 0.25);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #2C2C2C;
        --color-text: #FFFFFF;
        --color-border: #444444;
        --color-primary: #18A0FB;
        --color-secondary: #3D3D3D;
        --color-text-secondary: #AAAAAA;
        --color-bg-secondary: #333333;
        --scrollbar-thumb: rgba(255, 255, 255, 0.15);
        --scrollbar-thumb-hover: rgba(255, 255, 255, 0.25);
      }
    }

    /* Minimalist Scrollbars - Positioned 4px from the right edge */
    ::-webkit-scrollbar {
      width: 10px;
      /* Total scrollbar area */
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background-color: var(--scrollbar-thumb);
      background-clip: padding-box;
      /* 4px transparent right border shifts the thumb 4px to the left of the edge */
      border-right: 4px solid transparent;
      border-left: 2px solid transparent;
      border-top: 2px solid transparent;
      border-bottom: 2px solid transparent;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background-color: var(--scrollbar-thumb-hover);
    }

    body {
      font-family: var(--font-stack);
      font-size: 11px;
      margin: 0;
      padding: var(--padding);
      background-color: var(--color-bg);
      color: var(--color-text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
      gap: var(--gap);
      overflow: hidden;
    }

    .section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .section-title {
      font-weight: 600;
      color: var(--color-text-secondary);
      text-transform: uppercase;
      font-size: 9px;
      letter-spacing: 0.05em;
    }

    .info-card {
      background-color: var(--color-bg-secondary);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 6px 4px 6px 8px;
      /* Reduced right padding to bring scrollbar closer to edge but keeping content safe */
      line-height: 1.4;
      position: relative;
    }

    #copied-instances-list {
      max-height: 120px;
      overflow-y: auto;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    #copied-instances-list li {
      padding: 4px 0;
      border-bottom: 1px solid var(--color-border);
      color: var(--color-text);
      font-size: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-right: 8px;
      /* Ensure text doesn't touch the scrollbar area */
    }

    #copied-instances-list li:last-child {
      border-bottom: none;
    }

    /* Progress Bar Small */
    .progress-container {
      display: none;
      flex-direction: column;
      gap: 4px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      color: var(--color-text-secondary);
      font-size: 9px;
    }

    .progress-track {
      height: 4px;
      background-color: var(--color-border);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background-color: var(--color-primary);
      width: 0%;
      transition: width 0.2s ease;
    }

    /* Compact Buttons */
    .actions {
      margin-top: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      height: 28px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background-color: var(--color-primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--color-primary-hover);
    }

    .btn-primary:disabled {
      background-color: var(--color-bg-secondary);
      color: var(--color-text-secondary);
      border-color: var(--color-border);
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: var(--color-secondary);
      color: var(--color-text);
      border-color: var(--color-border);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: var(--color-border);
    }

    .status-bar {
      font-size: 9px;
      color: var(--color-text-secondary);
      text-align: center;
      height: 12px;
    }
  </style>
</head>

<body>

  <div class="section">
    <div class="section-title">Selección</div>
    <div id="selection-status" class="info-card">Esperando selección...</div>
  </div>

  <div id="copied-section" class="section" style="display: none;">
    <div class="section-title">Propiedades Copiadas</div>
    <div class="info-card">
      <ul id="copied-instances-list"></ul>
    </div>
  </div>

  <div id="progress-container" class="progress-container">
    <div class="progress-header">
      <span id="progress-label">Aplicando...</span>
      <span id="progress-percent">0%</span>
    </div>
    <div class="progress-track">
      <div id="progress-fill" class="progress-fill"></div>
    </div>
  </div>

  <div id="status" class="status-bar"></div>

  <div class="actions">
    <button id="btn-copy" class="btn-secondary">Copiar</button>
    <button id="btn-paste" class="btn-primary" disabled>Pegar</button>
  </div>

  <script>
    const btnCopy = document.getElementById('btn-copy');
    const btnPaste = document.getElementById('btn-paste');
    const statusDiv = document.getElementById('status');
    const selectionDiv = document.getElementById('selection-status');
    const copiedSection = document.getElementById('copied-section');
    const copiedList = document.getElementById('copied-instances-list');
    const progressContainer = document.getElementById('progress-container');
    const progressFill = document.getElementById('progress-fill');
    const progressPercent = document.getElementById('progress-percent');
    const progressLabel = document.getElementById('progress-label');

    btnCopy.onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'copy-properties' } }, '*');
    };

    btnPaste.onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'paste-properties' } }, '*');
    };

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;

      if (msg.type === 'selection-update') {
        const sel = msg.selection;
        if (sel.length === 0) {
          selectionDiv.innerHTML = 'Nada seleccionado';
        } else if (sel.length === 1) {
          selectionDiv.innerHTML = `<b>${sel[0].name}</b>`;
        } else {
          selectionDiv.innerHTML = `<b>${sel.length}</b> elementos`;
        }
      }

      if (msg.type === 'status') {
        statusDiv.textContent = msg.message;
        if (msg.timeout) {
          setTimeout(() => { if (statusDiv.textContent === msg.message) statusDiv.textContent = ''; }, msg.timeout);
        }
      }

      if (msg.type === 'progress') {
        progressContainer.style.display = 'flex';
        const p = Math.round(msg.value * 100);
        progressFill.style.width = p + '%';
        progressPercent.textContent = p + '%';
        if (msg.label) progressLabel.textContent = msg.label;

        if (p >= 100) {
          setTimeout(() => {
            progressContainer.style.display = 'none';
            progressFill.style.width = '0%';
          }, 1500);
        }
      }

      if (msg.type === 'properties-copied') {
        btnPaste.disabled = false;
        copiedSection.style.display = 'flex';
        copiedList.innerHTML = '';

        if (msg.instances && msg.instances.length > 0) {
          msg.instances.forEach(name => {
            const li = document.createElement('li');
            li.textContent = name;
            copiedList.appendChild(li);
          });
        } else {
          const li = document.createElement('li');
          li.textContent = "Raíz copiada";
          copiedList.appendChild(li);
        }
      }
    };
  </script>
</body>

</html>
